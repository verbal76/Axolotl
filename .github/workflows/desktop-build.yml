name: Desktop build (Linux / Steam Deck)

# Owner, 2026-10-11: a native Linux x86_64 build for Steam Deck / Steam Machine. Built only on
# request (Actions budget, CLAUDE.md): by a push that changes .github/desktop-build-request.json
# ({"sha": "<commit>"}) or by hand. Such a push touches only .github, so it starts no OTA publish and
# no Build & Verify.
# The Linux export preset is added to export_presets.cfg inside this run only: that file belongs to
# the Android native layer (runtime lock), and committing a desktop preset would change the phones'
# runtime fingerprint. Desktop builds have no OTA client (Boot runs it only with the Android "ota"
# feature); they play their bundled game, and a store (Steam) delivers their updates.
on:
  push:
    branches: [claude/mote-game-continuation-bov2x9]
    paths: [".github/desktop-build-request.json"]
  workflow_dispatch:
    inputs:
      sha:
        description: Commit to build (default the branch head)
        required: false

permissions:
  contents: write

env:
  GODOT_VERSION: 4.7.2
  GODOT_BASE: https://github.com/godotengine/godot/releases/download/4.7.2-stable

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/desktop-build-request.json
          sparse-checkout-cone-mode: false
          path: req
      - name: Which commit
        id: which
        run: |
          SHA="${{ github.event.inputs.sha }}"
          if [ -z "$SHA" ] && [ -f req/.github/desktop-build-request.json ]; then SHA=$(jq -r .sha req/.github/desktop-build-request.json); fi
          [ -n "$SHA" ] && [ "$SHA" != "null" ] || SHA="${{ github.sha }}"
          echo "$SHA" | grep -Eq '^[0-9a-f]{7,40}$' || { echo "::error::bad sha $SHA"; exit 1; }
          echo "sha=$SHA" >> $GITHUB_OUTPUT
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.which.outputs.sha }}
      - name: Install Godot + export templates
        run: |
          curl -sSL -o godot.zip "$GODOT_BASE/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip && sudo mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 /usr/local/bin/godot
          curl -sSL -o tpl.tpz "$GODOT_BASE/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          unzip -q tpl.tpz -d tpl && mv tpl/templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/
          rm -rf tpl tpl.tpz godot.zip
      - name: Linux export preset (this run only)
        run: |
          N=$(grep -c '^\[preset\.[0-9]*\]$' export_presets.cfg)
          cat >> export_presets.cfg <<EOF

          [preset.$N]

          name="Linux"
          platform="Linux"
          runnable=false
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter="tools/*, assets/icon/icon_source.png, assets/icon/icon_1024.png, assets/icon/icon_adaptive_*"
          export_path="build/linux/Mote.x86_64"
          encryption_include_filters=""
          encryption_exclude_filters=""
          encrypt_pck=false
          encrypt_directory=false

          [preset.$N.options]

          binary_format/embed_pck=true
          binary_format/architecture="x86_64"
          texture_format/s3tc_bptc=true
          texture_format/etc2_astc=false
          shader_baker/enabled=true
          version/name="0.1.0"
          EOF
          sed -i 's/^          //' export_presets.cfg
          tail -25 export_presets.cfg
          python3 tools/write_native_build_info.py "Linux" desktop "${{ github.run_number }}" "${{ steps.which.outputs.sha }}" "${{ github.run_id }}" \
            "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
      - name: Import and export
        run: |
          godot --headless --path . --import || true
          mkdir -p build/linux
          godot --headless --path . --export-release "Linux" build/linux/Mote.x86_64
          ls -la build/linux
          test -x build/linux/Mote.x86_64
      - name: Smoke test (the build starts, builds its world and quits)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb mesa-vulkan-drivers >/dev/null
          timeout 300 xvfb-run -a -s "-screen 0 1280x800x24" build/linux/Mote.x86_64 --rendering-method mobile --quit-after 900 > smoke.log 2>&1 || true
          grep -E "first frame drawn|moss ball 1 built|SCRIPT ERROR|Parse Error" smoke.log | head -20
          ! grep -q "SCRIPT ERROR\|Parse Error" smoke.log
      - name: Package
        id: pkg
        run: |
          SHORT=$(echo "${{ steps.which.outputs.sha }}" | cut -c1-7)
          NAME="mote-linux-x86_64-b${{ github.run_number }}-$SHORT"
          mkdir -p "dist/$NAME"
          cp build/linux/Mote.x86_64 "dist/$NAME/"
          printf 'Mote for Linux x86_64 / Steam Deck (build %s, source %s).\nRun ./Mote.x86_64. On a Steam Deck in Desktop Mode: Steam > Add a Non-Steam Game > Mote.x86_64, then play it from Game Mode.\n' \
            "${{ github.run_number }}" "${{ steps.which.outputs.sha }}" > "dist/$NAME/README.txt"
          tar -C dist -czf "dist/$NAME.tar.gz" "$NAME"
          sha256sum "dist/$NAME.tar.gz"
          echo "name=$NAME" >> $GITHUB_OUTPUT
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pkg.outputs.name }}
          path: dist/${{ steps.pkg.outputs.name }}.tar.gz
      - name: Publish a download (release, not "latest")
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          N="${{ steps.pkg.outputs.name }}"
          TAG="desktop-${N#mote-}"
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "${{ steps.which.outputs.sha }}" --latest=false --prerelease \
            --title "Mote for Linux / Steam Deck (build ${{ github.run_number }})" \
            --notes "Native Linux x86_64 build of source ${{ steps.which.outputs.sha }}. Extract and run Mote.x86_64. On Steam Deck: Desktop Mode > Steam > Add a Non-Steam Game." \
            "dist/$N.tar.gz"
