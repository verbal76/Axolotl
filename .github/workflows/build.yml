name: Build & Verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  GODOT_VERSION: 4.7.2
  GODOT_BASE: https://github.com/godotengine/godot/releases/download/4.7.2-stable

jobs:
  verify:
    name: Scripts + automated tests (headless)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot
        run: |
          curl -sSL -o godot.zip "$GODOT_BASE/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip && mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 /usr/local/bin/godot
      - name: Import project
        run: godot --headless --path . --import || true
      - name: Check every script compiles
        run: |
          godot --headless --path . -s tools/check_scripts.gd 2>&1 | tee check.log
          ! grep -E "Parse Error" check.log
      - name: Mechanics test suite
        run: |
          godot --headless --path . --fixed-fps 60 --max-fps 0 -- --test=unit --out=$PWD/test_out 2>&1 | tee unit.log
          grep -E "\[TEST\] SUMMARY [0-9]+ passed, 0 failed" unit.log
      - name: Beginning-to-end playthrough bot
        run: |
          godot --headless --path . --fixed-fps 60 --max-fps 0 -- --test=playthrough --out=$PWD/test_out 2>&1 | tee playthrough.log
          grep -E "\[TEST\] SUMMARY [0-9]+ passed, 0 failed" playthrough.log
      - name: Version-drift regression (all consumers follow the canonical GAME_VERSION)
        run: GODOT=godot tools/version_drift_check.sh
      - name: Native-runtime lock is current
        run: python3 tools/ota_runtime.py --check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test_out/

  android:
    name: Android APKs (normal offline + dev OTA)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Godot + export templates
        run: |
          curl -sSL -o godot.zip "$GODOT_BASE/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip && mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 /usr/local/bin/godot
          curl -sSL -o tpl.tpz "$GODOT_BASE/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          unzip -q tpl.tpz -d tpl && mv tpl/templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/
      - name: Signing keystore (stable from secret, so new APKs install over old ones)
        env:
          ANDROID_DEV_KEYSTORE_B64: ${{ secrets.ANDROID_DEV_KEYSTORE_B64 }}
        run: |
          if [ -n "$ANDROID_DEV_KEYSTORE_B64" ]; then
            echo "$ANDROID_DEV_KEYSTORE_B64" | base64 -d > $HOME/debug.keystore
            echo "Using the stable dev keystore from secrets."
          else
            echo "::warning::ANDROID_DEV_KEYSTORE_B64 secret not set: signing with a throwaway key. This APK will NOT install over a previously installed one (uninstall first)."
            keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore $HOME/debug.keystore \
              -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 9999
          fi
          keytool -list -v -keystore $HOME/debug.keystore -storepass android | grep -m1 "SHA256:" || true
          mkdir -p ~/.config/godot
          for f in editor_settings-4.tres editor_settings-4.7.tres; do
            cat > ~/.config/godot/$f <<CFG
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          CFG
            sed -i 's/^          //' ~/.config/godot/$f
          done
      - name: Read canonical identities (CI never defines the game version)
        id: ident
        run: |
          godot --headless --path . --import || true
          godot --headless --path . -s tools/print_identity.gd | grep IDENTITY_JSON | sed 's/^IDENTITY_JSON //' > identity.json
          cat identity.json
          echo "game_version=$(jq -r .game_version identity.json)" >> $GITHUB_OUTPUT
          echo "runtime_id=$(jq -r .runtime_id identity.json)" >> $GITHUB_OUTPUT
          test "$(jq -r .godot_version identity.json)" = "$GODOT_VERSION"
      - name: Export APKs
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: /home/runner/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
          GV: ${{ steps.ident.outputs.game_version }}
        run: |
          # ANDROID BUILD (versionCode) = this workflow's run number: monotonic, never the game version.
          BUILD=${{ github.run_number }}
          sed -i "s/^version\/code=.*/version\/code=$BUILD/" export_presets.cfg
          RUN="${{ github.run_id }}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          mkdir -p build/android
          python3 tools/write_native_build_info.py "Android" normal "$BUILD" "$GITHUB_SHA" "$RUN" "$RUN_URL"
          godot --headless --path . --export-debug "Android" "build/android/axolotl-v$GV-b$BUILD.apk"
          python3 tools/write_native_build_info.py "Android Dev" dev "$BUILD" "$GITHUB_SHA" "$RUN" "$RUN_URL"
          godot --headless --path . --export-debug "Android Dev" "build/android/axolotl-dev-v$GV-b$BUILD.apk"
          ls -la build/android
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt | tail -1)
          AAPT2=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | tail -1)
          for apk in build/android/*.apk; do
            test -s "$apk"
            echo "== $apk"
            "$AAPT" dump badging "$apk" 2>/dev/null | grep -E "^package:|application-label:|application-icon-160|launchable" || true
            "$AAPT2" dump xmltree --file AndroidManifest.xml "$apk" > "$apk.manifest.txt"
            grep -oE 'android.permission\.[A-Z_]+' "$apk.manifest.txt" | sort -u | sed 's/^/  permission: /'
          done
          # The normal build must stay offline; the dev build is the only one with network access.
          if grep -q "android.permission.INTERNET" "build/android/axolotl-v$GV-b$BUILD.apk.manifest.txt"; then
            echo "::error::the normal (offline) APK requests INTERNET"; exit 1
          fi
          if ! grep -q "android.permission.INTERNET" "build/android/axolotl-dev-v$GV-b$BUILD.apk.manifest.txt"; then
            echo "::error::the dev APK cannot reach the OTA channel (no INTERNET permission)"; exit 1
          fi
          rm -f build/android/*.manifest.txt build/android/*.idsig
          jq -n --arg gv "$GV" --arg b "$BUILD" --arg sha "$GITHUB_SHA" --arg run "$RUN" --arg url "$RUN_URL" \
            --arg rt "${{ steps.ident.outputs.runtime_id }}" \
            '{game_version:$gv, android_build:($b|tonumber), source_sha:$sha, build_run:$run, build_run_url:$url, runtime_id:$rt,
              apks:{normal:{package:"com.verbal76.axolotl", ota:false}, dev:{package:"com.verbal76.axolotl.dev", ota:true, channel:"dev"}}}' \
            > build/android/build-info.json
          cat build/android/build-info.json
      - uses: actions/upload-artifact@v4
        with:
          name: axolotl-android-v${{ steps.ident.outputs.game_version }}-b${{ github.run_number }}
          path: |
            build/android/axolotl-v*.apk
            build/android/build-info.json
      - uses: actions/upload-artifact@v4
        with:
          name: axolotl-android-dev-v${{ steps.ident.outputs.game_version }}-b${{ github.run_number }}
          path: |
            build/android/axolotl-dev-v*.apk
            build/android/build-info.json

  ios:
    name: iOS simulator build (unsigned)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot + export templates
        run: |
          curl -sSL -o godot.zip "$GODOT_BASE/Godot_v${GODOT_VERSION}-stable_macos.universal.zip"
          unzip -q godot.zip
          curl -sSL -o tpl.tpz "$GODOT_BASE/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          T="$HOME/Library/Application Support/Godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$T"
          unzip -q tpl.tpz -d tpl && mv tpl/templates/* "$T/"
      - name: Export Xcode project
        run: |
          GODOT=./Godot.app/Contents/MacOS/Godot
          $GODOT --headless --path . --import || true
          mkdir -p build/ios
          $GODOT --headless --path . --export-debug "iOS" build/ios/Axolotl.ipa
          ls -la build/ios
      - name: Build for the iOS Simulator
        run: |
          cd build/ios
          xcodebuild -project Axolotl.xcodeproj -scheme Axolotl -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath dd \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO ONLY_ACTIVE_ARCH=NO build | tail -40
          APP=$(find dd -name "*.app" -maxdepth 5 | head -1)
          echo "Built: $APP"
          test -n "$APP"
          ditto -c -k --keepParent "$APP" ../axolotl-ios-simulator.zip
      - uses: actions/upload-artifact@v4
        with:
          name: axolotl-ios-simulator-app
          path: build/axolotl-ios-simulator.zip
