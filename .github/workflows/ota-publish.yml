name: OTA publish (dev channel)

# Publishes the game layer as a signed, immutable OTA for the installed Mote app.
# No APK is built here. Order of evidence:
#   exact SHA -> tests (fast checks, 2 unit shards, playthrough: parallel jobs of tests.yml, on that SHA)
#   -> runtime gate -> PCK -> SHA-256/size -> signed manifest
#   -> client-side inspection -> immutable release -> re-download + re-verify
#   -> channel pointer moved forward -> receipt.

# MANUAL DISPATCH ONLY (owner decisions 2026-10-12; studio standard §9-§10). The ONLY way to publish an OTA is
# Actions > OTA publish > Run workflow, from the release branch. There is deliberately no push, pull_request,
# tag, schedule, workflow_run or other trigger: no push (including a change to a request file), merge,
# PR update, tag, version change, native build, schedule or other workflow can start this workflow
# (`release_guard.py lint` refuses any other trigger: release-source.json "dispatch_only"; its self-test
# simulates every event against this file).
# Authorization comes from GitHub, not from the form: tools/ota_request.py requires the authenticated actor
# (github.actor) == the account that started this attempt (github.triggering_actor) == authorized_by, the
# actor listed in release-source.json "ota_publishers" AND a repository admin (read from the API), the run
# dispatched from the release branch, confirm == PUBLISH, an exact 40-hex SHA on the release branch, the
# runtime that SHA builds, the channel, the exact next OTA revision, and neither that revision nor that
# commit already published. The resolve job checks it, and the publish job checks it all again before
# building or signing anything. Owner-only enforcement beyond an admin account: the `ota-dev` environment
# below; add a required reviewer to it (Settings > Environments) and every run waits for that approval.
# docs/OTA_PUBLISHING.md.
# History: until 2026-10-12 every game-file push to the release branch published; a request-file push
# trigger existed briefly on 2026-10-12 and was removed before it reached the release branch; and the retired
# Expansions branch claude/axolotl-aquarium-platformer-3y0qyy published dev-000015..dev-000024.
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact 40-character commit SHA on the release branch
        required: true
      runtime_id:
        description: Runtime that commit builds (installed phones must match), e.g. android-godot-4.7.2-r5
        required: true
      channel:
        type: choice
        options: [dev]
        default: dev
      ota_revision:
        description: The exact next OTA revision to publish, e.g. dev-000112 (python3 tools/ota_request.py next-revision)
        required: true
      ota_name:
        description: Optional title suffix (a-z, 0-9, -), e.g. polish-pass
        required: false
      authorized_by:
        description: Your GitHub login (must be the account running this workflow)
        required: true
      reason:
        description: Optional reason (recorded in the run)
        required: false
      confirm:
        description: Type PUBLISH to publish an OTA to every installed phone on the channel
        required: true

permissions:
  contents: write

concurrency:
  group: ota-dev-channel
  cancel-in-progress: false

env:
  GODOT_VERSION: 4.7.2
  GODOT_BASE: https://github.com/godotengine/godot/releases/download/4.7.2-stable
  CHANNEL: dev
  PRESET: Android
  MOTE_OTA_PUBKEY_DER_SHA256: a003a45ce422325ef1de52958bd9d4d2a06b912ae119c6c7a7f9e40ff2720cf2

jobs:
  # Resolve the requested ref to ONE full commit SHA. The tests and the publish job both check out that SHA,
  # never a branch name, so what is published is exactly what passed.
  resolve:
    name: Resolve exact SHA
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.r.outputs.sha }}
      runtime_id: ${{ steps.req.outputs.runtime_id }}
      ota_revision: ${{ steps.req.outputs.ota_revision }}
      ota_name: ${{ steps.req.outputs.ota_name }}
    steps:
      # The request is the form; it is validated, with GitHub's authorization context and the release
      # branch's history and tags, before the requested commit is checked out.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate the authorization and the publication request
        id: req
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          REF: ${{ github.ref }}
          IN_SHA: ${{ inputs.source_sha }}
          IN_RT: ${{ inputs.runtime_id }}
          IN_CH: ${{ inputs.channel }}
          IN_REV: ${{ inputs.ota_revision }}
          IN_NAME: ${{ inputs.ota_name }}
          IN_BY: ${{ inputs.authorized_by }}
          IN_REASON: ${{ inputs.reason }}
          IN_CONFIRM: ${{ inputs.confirm }}
        run: |
          [ "$EVENT" = "workflow_dispatch" ] || { echo "::error::OTA refused: publication starts only from a manual run, not '$EVENT'"; exit 1; }
          PERM=$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$ACTOR/permission" --jq .permission || echo unknown)
          echo "actor=$ACTOR triggering_actor=$TRIGGERING_ACTOR permission=$PERM ref=$REF"
          jq -n --arg s "$IN_SHA" --arg r "$IN_RT" --arg c "$IN_CH" --arg v "$IN_REV" --arg n "$IN_NAME" --arg b "$IN_BY" --arg why "$IN_REASON" \
            '{source_sha:$s, runtime_id:$r, channel:$c, ota_revision:$v, authorized_by:$b}
             + (if $n == "" then {} else {ota_name:$n} end) + (if $why == "" then {} else {reason:$why} end)' > "$RUNNER_TEMP/request.json"
          cat "$RUNNER_TEMP/request.json"
          python3 tools/ota_request.py validate --request "$RUNNER_TEMP/request.json" --actor "$ACTOR" \
            --triggering-actor "$TRIGGERING_ACTOR" --permission "$PERM" --ref "$REF" --confirm "$IN_CONFIRM" | tee -a "$GITHUB_OUTPUT"
          test "${PIPESTATUS[0]}" = 0
          test "$(jq -r .channel "$RUNNER_TEMP/request.json")" = "$CHANNEL"
      - name: Check out exactly the requested commit
        run: git checkout --detach "${{ steps.req.outputs.sha }}"
      - id: r
        run: |
          echo "sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT
          test "$(git rev-parse HEAD)" = "${{ steps.req.outputs.sha }}"
      - name: Release source guard (only the authoritative branch publishes)
        run: python3 tools/release_guard.py check --sha "${{ steps.r.outputs.sha }}" --contains-published 'ota-dev-*'

  # The release gate: fast checks + both unit shards + the playthrough, in parallel, on the exact SHA.
  tests:
    name: Tests
    needs: resolve
    # (Only the publish job writes: the tests read the commit.)
    permissions:
      contents: read
    uses: ./.github/workflows/tests.yml
    with:
      ref: ${{ needs.resolve.outputs.sha }}
      full: true

  publish:
    name: Publish OTA to dev
    # Runs only when every test job succeeded (a skipped or failed `tests` stops the release).
    needs: [resolve, tests]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # GitHub-enforced approval point: when the owner adds a required reviewer to the `ota-dev` environment
    # (Settings > Environments), this job waits for that person's approval before it can run or read secrets.
    environment: ota-dev
    steps:
      # Independent re-check, in this job, before anything is built or signed: the same authorization and
      # request validation as `resolve`, with the permission read again, using this workflow's own tools.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Re-check the authorization and the request (independently of resolve)
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          REF: ${{ github.ref }}
          IN_SHA: ${{ inputs.source_sha }}
          IN_RT: ${{ inputs.runtime_id }}
          IN_CH: ${{ inputs.channel }}
          IN_REV: ${{ inputs.ota_revision }}
          IN_NAME: ${{ inputs.ota_name }}
          IN_BY: ${{ inputs.authorized_by }}
          IN_CONFIRM: ${{ inputs.confirm }}
          R_SHA: ${{ needs.resolve.outputs.sha }}
          R_RT: ${{ needs.resolve.outputs.runtime_id }}
          R_REV: ${{ needs.resolve.outputs.ota_revision }}
        run: |
          [ "$EVENT" = "workflow_dispatch" ] || { echo "::error::OTA refused: not a manual run"; exit 1; }
          PERM=$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$ACTOR/permission" --jq .permission || echo unknown)
          jq -n --arg s "$IN_SHA" --arg r "$IN_RT" --arg c "$IN_CH" --arg v "$IN_REV" --arg n "$IN_NAME" --arg b "$IN_BY" \
            '{source_sha:$s, runtime_id:$r, channel:$c, ota_revision:$v, authorized_by:$b} + (if $n == "" then {} else {ota_name:$n} end)' > "$RUNNER_TEMP/request.json"
          python3 tools/ota_request.py validate --request "$RUNNER_TEMP/request.json" --actor "$ACTOR" \
            --triggering-actor "$TRIGGERING_ACTOR" --permission "$PERM" --ref "$REF" --confirm "$IN_CONFIRM"
          # What resolve and the tests used is exactly what was requested.
          test "$R_SHA" = "$IN_SHA" && test "$R_RT" = "$IN_RT" && test "$R_REV" = "$IN_REV" \
            || { echo "::error::resolve outputs differ from the request"; exit 1; }
          python3 tools/release_guard.py check --sha "$IN_SHA" --contains-published "ota-$CHANNEL-*"
      - name: Check out exactly the requested commit
        run: |
          git checkout --detach "${{ needs.resolve.outputs.sha }}"
          git clean -ffdx

      - name: Exact source identity
        id: src
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHA=$(git rev-parse HEAD)
          test "$SHA" = "${{ needs.resolve.outputs.sha }}"
          echo "sha=$SHA" >> $GITHUB_OUTPUT
          # Public version (studio convention, docs/VERSIONING.md "Public version"): every published OTA
          # is a delivered playable build "Mote vN", N = its seq. N = one more than the highest seq
          # ever published on this channel, so numbers are sequential, never reused, and failed runs
          # leave no gaps. (Before 2026-10-04 seq was the run number: v1-v92 have a few gaps.)
          LAST=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1000 --json tagName \
            --jq "[.[].tagName | select(startswith(\"ota-$CHANNEL-\")) | ltrimstr(\"ota-$CHANNEL-\") | tonumber] | max // 0")
          test -n "$LAST"
          SEQ=$((LAST + 1))
          ID=$(printf "%s-%06d" "$CHANNEL" "$SEQ")
          # The revision the release list gives must be exactly the one the owner authorized.
          test "$ID" = "${{ needs.resolve.outputs.ota_revision }}" \
            || { echo "::error::next revision is $ID, the request authorized ${{ needs.resolve.outputs.ota_revision }}: not publishing"; exit 1; }
          gh release view "ota-$ID" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            && { echo "::error::ota-$ID already exists; OTA releases are immutable"; exit 1; }
          echo "seq=$SEQ" >> $GITHUB_OUTPUT
          echo "ota_id=$ID" >> $GITHUB_OUTPUT
          echo "tag=ota-$ID" >> $GITHUB_OUTPUT
          echo "Publishing $ID from $SHA"

      - name: Native-runtime compatibility gate
        run: python3 tools/ota_runtime.py --check

      - name: Install Godot (the runtime's exact engine version)
        run: |
          curl -sSL -o godot.zip "$GODOT_BASE/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip && mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 /usr/local/bin/godot

      - name: Import + read canonical identities
        id: ident
        run: |
          godot --headless --path . --import || true
          # Written outside the project so it is never packed into the PCK.
          ID="$RUNNER_TEMP/identity.json"
          godot --headless --path . -s tools/print_identity.gd | grep IDENTITY_JSON | sed 's/^IDENTITY_JSON //' > "$ID"
          cat "$ID"
          test "$(jq -r .godot_version "$ID")" = "$GODOT_VERSION"
          test "$(jq -r .channel "$ID")" = "$CHANNEL"
          echo "game_version=$(jq -r .game_version "$ID")" >> $GITHUB_OUTPUT
          echo "runtime_id=$(jq -r .runtime_id "$ID")" >> $GITHUB_OUTPUT
          # The runtime this build really is must be the one the request authorized.
          test "$(jq -r .runtime_id "$ID")" = "${{ needs.resolve.outputs.runtime_id }}" \
            || { echo "::error::built runtime $(jq -r .runtime_id "$ID") is not the requested ${{ needs.resolve.outputs.runtime_id }}"; exit 1; }

      - name: Required checks (scripts compile; mechanics and playthrough passed in the tests job on this exact SHA)
        run: |
          godot --headless --path . -s tools/check_scripts.gd 2>&1 | tee check.log
          if grep -E "Parse Error" check.log; then exit 1; fi

      - name: Signing key
        id: key
        env:
          MOTE_OTA_SIGNING_KEY: ${{ secrets.MOTE_OTA_SIGNING_KEY }}
        run: |
          # Report presence only; the value is never printed.
          if [ -z "$MOTE_OTA_SIGNING_KEY" ]; then
            echo "::warning::MOTE_OTA_SIGNING_KEY secret is not set: NOT PUBLISHING. Add it in Settings > Secrets and variables > Actions."
            echo "ok=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          umask 077
          echo "MOTE_OTA_SIGNING_KEY: present"
          # Rebuild a canonical PEM from however the key was pasted: phones turn line breaks into
          # spaces, add CRLF, turn "-----" into dashes of other kinds, or drop the BEGIN/END lines.
          # Only structural facts are printed, never key material.
          python3 - "$RUNNER_TEMP/ota_key.pem" <<'PY'
          import base64, binascii, os, re, sys, textwrap
          raw = os.environ["MOTE_OTA_SIGNING_KEY"].replace("\r", "")
          lines = raw.count("\n") + 1
          marker = re.compile(r"[-\u2010-\u2015\u2212\s]*(BEGIN|END) ?([A-Z]* ?)PRIVATE KEY[-\u2010-\u2015\u2212\s]*")
          kinds = {m.group(2).strip() for m in marker.finditer(raw)}
          found = [m.group(1) for m in marker.finditer(raw)]
          body = re.sub(r"[^A-Za-z0-9+/=]", "", marker.sub("", raw))
          print(f"key text: {lines} lines, markers found: {found or 'none (rebuilding them)'}, base64 body: {len(body)} chars")
          try:
              der = base64.b64decode(body, validate=True)
          except (binascii.Error, ValueError):
              sys.exit("MOTE_OTA_SIGNING_KEY: the text is not a base64 private key")
          if not der or der[0] != 0x30:
              sys.exit("MOTE_OTA_SIGNING_KEY: decoded text is not a DER key")
          # PKCS#8 ("PRIVATE KEY") unless the paste said it was PKCS#1 ("RSA PRIVATE KEY").
          label = "RSA PRIVATE KEY" if kinds == {"RSA"} else "PRIVATE KEY"
          print(f"decoded key: {len(der)} bytes, rebuilt as {label}")
          pem = f"-----BEGIN {label}-----\n" + "\n".join(textwrap.wrap(body, 64)) + f"\n-----END {label}-----\n"
          open(sys.argv[1], "w").write(pem)
          PY
          openssl pkey -in "$RUNNER_TEMP/ota_key.pem" -pubout > "$RUNNER_TEMP/derived_pub.pem"
          python3 - "$RUNNER_TEMP/derived_pub.pem" <<'PY'
          import re, sys
          derived = open(sys.argv[1]).read().strip()
          embedded = re.search(r'const PUBLIC_KEY_PEM := """(.*?)"""', open("scripts/boot/ota_config.gd").read(), re.S).group(1).strip()
          if derived != embedded:
              sys.exit("MOTE_OTA_SIGNING_KEY does not match the public key embedded in the APK bootstrap")
          print("signing key matches the APK's embedded public key")
          PY
          test "$(openssl pkey -pubin -in "$RUNNER_TEMP/derived_pub.pem" -outform DER | sha256sum | cut -d' ' -f1)" = "$MOTE_OTA_PUBKEY_DER_SHA256"
          echo "OTA public key SHA-256 matches the pin"
          echo "ok=true" >> $GITHUB_OUTPUT

      - name: Export PCK + build and sign the manifest
        if: steps.key.outputs.ok == 'true'
        env:
          ID: ${{ steps.src.outputs.ota_id }}
          TAG: ${{ steps.src.outputs.tag }}
          SHA: ${{ steps.src.outputs.sha }}
          SEQ: ${{ steps.src.outputs.seq }}
        run: |
          mkdir -p out
          # Bake shaders into the pack (see build.yml): software Vulkan (Mobile) under a virtual display.
          sudo apt-get update -q > /dev/null && sudo apt-get install -y -q mesa-vulkan-drivers xvfb > /dev/null
          xvfb-run -a -s "-screen 0 1280x720x24" godot --path . --rendering-driver vulkan --rendering-method mobile \
            --export-pack "$PRESET" "out/axolotl-$ID.pck" 2>&1 | tee export.log | grep -E "Baking shaders|ERROR" || true
          grep -q "Started Baking shaders" export.log || { echo "::error::shaders were not baked into the OTA pack"; exit 1; }
          test -s "out/axolotl-$ID.pck"
          python3 tools/pck_files.py "out/axolotl-$ID.pck" --require-baked
          # Standing requirement (CLAUDE.md): the canonical Hot Attic Games logo is in the pack, pixel-exact.
          godot --headless --path . -s tools/check_pack_logo.gd -- pck="out/axolotl-$ID.pck" | tee logo.log
          grep -q "LOGO OK" logo.log
          URL="${{ github.server_url }}/${{ github.repository }}/releases/download/$TAG/axolotl-$ID.pck"
          godot --headless --path . -s tools/ota_make_manifest.gd -- pck="out/axolotl-$ID.pck" out=out/manifest.json \
            seq="$SEQ" sha="$SHA" url="$URL" channel="$CHANNEL" run_id="${{ github.run_id }}" \
            run_number="${{ github.run_number }}" run_attempt="${{ github.run_attempt }}" \
            run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          cat out/manifest.json
          openssl dgst -sha256 -sign "$RUNNER_TEMP/ota_key.pem" -out out/manifest.sig.bin out/manifest.json
          base64 -w0 out/manifest.sig.bin > out/manifest.json.sig
          rm -f out/manifest.sig.bin "$RUNNER_TEMP/ota_key.pem"
          # Same client code as the phone: signature, runtime, size, SHA-256, and the game version
          # inside the pack == manifest == canonical source.
          godot --headless --path . -s tools/ota_inspect_pack.gd -- manifest=out/manifest.json \
            sig=out/manifest.json.sig pck="out/axolotl-$ID.pck" platform=android \
            expect_version="${{ steps.ident.outputs.game_version }}" | tee inspect.log
          grep -q "INSPECT OK" inspect.log

      - name: Publish immutable release (PCK + manifest + signature)
        if: steps.key.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ID: ${{ steps.src.outputs.ota_id }}
          TAG: ${{ steps.src.outputs.tag }}
          SHA: ${{ steps.src.outputs.sha }}
          GV: ${{ steps.ident.outputs.game_version }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::$TAG already exists; OTA releases are immutable"; exit 1
          fi
          SEQ=$((10#${ID##*-}))
          # Descriptive OTA name (owner, 2026-10-05): "Mote v97-hints-pads-reeds" when the released commit
          # carries an "OTA-Name: hints-pads-reeds" trailer (letters, digits, dashes); else "Mote vN".
          PURPOSE="${{ needs.resolve.outputs.ota_name }}"
          [ -n "$PURPOSE" ] || PURPOSE=$(git log -1 --format='%(trailers:key=OTA-Name,valueonly)' "$SHA" | head -1 | tr -cd 'a-z0-9-')
          TITLE="Mote v$SEQ${PURPOSE:+-$PURPOSE}"
          echo "release title: $TITLE"
          printf '%s\n' "# $TITLE" "" \
            "**Nothing to download:** the Mote app on your phone installs Mote v$SEQ by itself (at launch, while Mote is loading)." \
            "New phone: install the Mote app once (Android, \`com.verbal76.axolotl\`); it then updates itself to the newest version." "" \
            "---" "Technical provenance (for engineers):" \
            "- OTA revision: $ID (dev channel), immutable" \
            "- Source commit: $SHA" \
            "- Native runtime: ${{ steps.ident.outputs.runtime_id }}" \
            "- Internal game version: $GV" \
            "- Built by run ${{ github.run_id }}" \
            "- Files: axolotl-$ID.pck (game payload), manifest.json + manifest.json.sig (signed)" > notes.md
          gh release create "$TAG" --target "$SHA" --latest \
            --title "$TITLE" --notes-file notes.md \
            "out/axolotl-$ID.pck" out/manifest.json out/manifest.json.sig

      - name: Re-download published objects and verify them
        if: steps.key.outputs.ok == 'true'
        env:
          ID: ${{ steps.src.outputs.ota_id }}
          TAG: ${{ steps.src.outputs.tag }}
        run: |
          mkdir -p dl
          B="${{ github.server_url }}/${{ github.repository }}/releases/download/$TAG"
          for i in 1 2 3 4 5; do
            curl -fsSL -o "dl/axolotl-$ID.pck" "$B/axolotl-$ID.pck" && curl -fsSL -o dl/manifest.json "$B/manifest.json" \
              && curl -fsSL -o dl/manifest.json.sig "$B/manifest.json.sig" && break
            sleep $((i * 5))
          done
          cmp out/manifest.json dl/manifest.json
          cmp out/manifest.json.sig dl/manifest.json.sig
          test "$(sha256sum dl/axolotl-$ID.pck | cut -d' ' -f1)" = "$(jq -r .pck_sha256 out/manifest.json)"
          godot --headless --path . -s tools/ota_inspect_pack.gd -- manifest=dl/manifest.json \
            sig=dl/manifest.json.sig pck="dl/axolotl-$ID.pck" platform=android | tee inspect_dl.log
          grep -q "INSPECT OK" inspect_dl.log

      - name: Move the channel pointer forward
        if: steps.key.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ID: ${{ steps.src.outputs.ota_id }}
          TAG: ${{ steps.src.outputs.tag }}
          SEQ: ${{ steps.src.outputs.seq }}
        run: |
          PTAG="ota-channel-$CHANNEL"
          B="${{ github.server_url }}/${{ github.repository }}/releases/download"
          if ! gh release view "$PTAG" >/dev/null 2>&1; then
            gh release create "$PTAG" --prerelease --title "OTA channel pointer: $CHANNEL" \
              --notes "Mutable pointer (latest.json) to the newest immutable $CHANNEL OTA. Do not delete."
          fi
          CUR=$(curl -fsSL "$B/$PTAG/latest.json" 2>/dev/null | jq -r '.seq // 0' || echo 0)
          if [ "${CUR:-0}" -ge "$SEQ" ]; then
            echo "::warning::channel already points at seq $CUR >= $SEQ; pointer left unchanged"
            echo "POINTER_MOVED=false" >> $GITHUB_ENV
            exit 0
          fi
          jq -n --arg ch "$CHANNEL" --arg id "$ID" --argjson seq "$SEQ" \
            --arg m "$B/$TAG/manifest.json" --arg s "$B/$TAG/manifest.json.sig" \
            --arg at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{channel:$ch, ota_id:$id, seq:$seq, manifest_url:$m, signature_url:$s, published_at:$at}' > latest.json
          gh release upload "$PTAG" latest.json --clobber
          for i in 1 2 3 4 5 6; do
            GOT=$(curl -fsSL "$B/$PTAG/latest.json?nocache=$RANDOM" | jq -r .ota_id || true)
            [ "$GOT" = "$ID" ] && break
            sleep $((i * 5))
          done
          test "$GOT" = "$ID"
          echo "POINTER_MOVED=true" >> $GITHUB_ENV

      - name: Release titles follow the public version (presentation only)
        if: steps.key.outputs.ok == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Older OTA releases were titled "OTA dev-0000NN (...)": retitle them "Mote vN". Titles only:
          # tags, files, signatures and the pointer are untouched (idempotent).
          gh release list --repo "$GITHUB_REPOSITORY" --limit 1000 --json tagName,name \
            --jq ".[] | select(.tagName | startswith(\"ota-$CHANNEL-\")) | [.tagName, .name] | @tsv" |
          while IFS=$'\t' read -r tag name; do
            want="Mote v$((10#${tag##*-}))"
            # (A descriptive name, "Mote vN-purpose", is kept.)
            case "$name" in "$want"|"$want"-*) continue ;; esac
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --title "$want" >/dev/null || true
          done

      - name: Publication receipt
        if: always()
        env:
          ID: ${{ steps.src.outputs.ota_id }}
          TAG: ${{ steps.src.outputs.tag }}
        run: |
          PUBLISHED=false
          [ "${{ steps.key.outputs.ok }}" = "true" ] && [ "${{ job.status }}" = "success" ] && PUBLISHED=true
          jq -n --arg id "$ID" --arg sha "${{ steps.src.outputs.sha }}" --arg rt "${{ steps.ident.outputs.runtime_id }}" \
            --arg gv "${{ steps.ident.outputs.game_version }}" --arg ch "$CHANNEL" \
            --arg rel "${{ github.server_url }}/${{ github.repository }}/releases/tag/$TAG" \
            --arg ptr "${{ github.server_url }}/${{ github.repository }}/releases/download/ota-channel-$CHANNEL/latest.json" \
            --arg run "${{ github.run_id }}" --arg pub "$PUBLISHED" --arg moved "${POINTER_MOVED:-false}" \
            --slurpfile m <(cat out/manifest.json 2>/dev/null || echo '{}') \
            '{published:($pub=="true"), channel:$ch, ota_id:$id, source_sha:$sha, runtime_id:$rt, game_version:$gv,
              pck_sha256:($m[0].pck_sha256 // null), pck_size:($m[0].pck_size // null), manifest:$rel,
              channel_pointer:$ptr, pointer_moved:($moved=="true"), build_run:$run}' > receipt.json
          cat receipt.json
          {
            echo "## OTA publication receipt"
            echo ""
            echo '```json'
            cat receipt.json
            echo '```'
          } >> $GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ota-receipt-${{ steps.src.outputs.ota_id }}
          path: |
            receipt.json
            out/manifest.json
            out/manifest.json.sig
